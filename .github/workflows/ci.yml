name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  anti-leak:
    name: Anti-leak gate (no company branding references)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on company branding references
        run: |
          # Pattern uses a character-class split so this workflow file's own
          # grep string does not match the anti-leak check itself. Human-facing
          # messages below deliberately avoid the banned tokens too.
          if grep -rIni 'net4[s]ats\|felix[f]elix' . --exclude-dir=.git --exclude-dir=node_modules; then
            echo "::error::company branding reference found. TollGate is a protocol and must not depend on any company branding."
            exit 1
          fi
          echo "Anti-leak gate passed: zero company branding references."

  unit-tests:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Packaging guards (admin board credential fail-closed)
        # A fresh router whose root /etc/shadow hash is UNSET accepts ANY
        # password through rpcd's session.login. These two gates keep the
        # surface shut: the uci-defaults must not serve :8090/:8443 in that
        # state, and the rpcd plugin must refuse every method that acts on the
        # router (exposing only the pre-auth auth_status probe).
        #
        # They run FIRST, before the vitest suite: pure POSIX sh, no network, no
        # root, ~1s each, and they must not be masked by an unrelated failure in
        # a suite they are not part of (the vitest run is currently red on main
        # for a heap OOM in the full-suite process).
        run: |
          sh packaging/tests/test-92-admin-credential-guard.sh
          sh packaging/tests/test-rpcd-tollgate-credential-guard.sh
      - name: Packaging guard (LuCI redirect derived from a covering certificate)
        # uhttpd.main.redirect_https is a DERIVED value written by TWO scripts —
        # this repo's 92-tollgate-admin-setup and the module's 99-tollgate-setup —
        # and last-writer-wins differs by install path (postinst: 90, 99, 92;
        # numeric uci-defaults at boot: 90, 92, 99). They only agree if they
        # evaluate the same rule, so:
        #   * test-92-luci-redirect-guard.sh runs the shipped 92 block with a
        #     stubbed uci + CLI: a non-covering identity must repair a stale
        #     redirect to 0, an unusable CLI must fail closed, and the block must
        #     not decide from the image's placeholder path (the pre17 bench
        #     certificate error).
        #   * test-redirect-https-single-rule.sh reads BOTH writers (the module's
        #     is fetched if no checkout is given) and fails if either carries a
        #     premise of its own instead of the shared `tollgate ssl covers` check.
        run: |
          sh packaging/tests/test-92-luci-redirect-guard.sh
          sh packaging/tests/test-redirect-https-single-rule.sh
      - name: Packaging guard (entry_ui mapping, D4 marker, pre-auth allow list)
        # The mode-aware 92 (docs/architecture/default-ui-and-entry-port-decision.md
        # D2/D3/D4/D7): from the same `entry_ui` value the module's 99 reads it
        # binds either the entry pair (8080 + 443) or the secondary pair
        # (8090 + 8443), announces the mapping with the /etc/tollgate/entry-ui-mapping
        # marker (absent when the run refuses to serve, which is what keeps the
        # module half on the legacy mapping), and never puts an admin port in
        # nodogsplash's pre-auth list. Whole-script sandbox, no root, no network.
        run: |
          sh packaging/tests/test-92-entry-ui-mapping.sh
          sh packaging/tests/test-92-nodogsplash-pre-auth-guard.sh
      - name: Packaging guard (admin board TLS identity + derived redirect)
        # The :8090 board was the last surface still pinned to the OpenWrt
        # image's placeholder certificate (/etc/uhttpd.crt, CN=OpenWrt) and it
        # never redirected its own plain-HTTP port. This guard runs the shipped
        # blocks with a stubbed uci + CLI and pins the rule: the board's :8443
        # listener carries the identity the MODULE provisioned
        # (/etc/tollgate/ssl/server.{crt,key}), the image's pair is only a
        # fallback LISTENER identity, and uhttpd.admin.redirect_https is derived
        # from the SAME coverage predicate as the LuCI hop — armed only when the
        # identity covers this router, explicit in both directions, and dropped
        # again (fail open) when :8443 never came up.
        run: sh packaging/tests/test-92-admin-board-tls.sh
      - run: npm test
      - name: Packaging guard (foreign-skin cleanup)
        run: sh tests/packaging/foreign-skins-guard.sh .
      - run: npm run build

  e2e-tests:
    name: E2E tests + screenshots (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Start dev server
        run: npm run dev &
      - name: Wait for server
        run: npx wait-on http://localhost:5173 --timeout 30000

      - name: Run admin board credential guard (mandatory)
        # The :8090 board must REFUSE to render a login form against a router
        # whose root /etc/shadow hash is unset: rpcd's session.login accepts ANY
        # password (including "") while it is empty, so a successful login would
        # prove nothing. Runs the real Preact app in VITE_MOCK mode, with the
        # router's state selected by ?mockCredentialState=.
        #
        # It runs before the portal functional suite: it is self-contained (its
        # own vite dev server on :5199), and the credential gate must not be
        # masked by an unrelated portal test failure.
        run: npx playwright test --config admin/playwright.config.mjs admin-credential-guard

      - name: Run functional tests (mandatory)
        run: npx playwright test tests/e2e/functional.spec.mjs --project=desktop

      - name: Run visual tests (informational — allowed to fail)
        run: npx playwright test tests/e2e/visual.spec.mjs --project=desktop || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.event.pull_request.number || github.run_id }}
          path: |
            test-results/output/
            test-results/report/
          retention-days: 3

      - name: Upload visual diffs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs-${{ github.event.pull_request.number || github.run_id }}
          path: |
            tests/e2e/**/*.png
            test-results/output/*-diff.png
          retention-days: 3

      - name: Post screenshots link to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const status = process.env.JOB_STATUS === 'success'
              ? '✅ All tests passed.'
              : '⚠️ Some tests failed — check the visual diffs artifact.';
            const artifactName = `screenshots-${context.issue.number}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📸 Test results\n\nPlaywright e2e tests + visual snapshots completed.\n\n**[Download screenshots →](${runUrl})**\n\nLook for the \`${artifactName}\` artifact at the bottom of the run page.\n\n${status}`
            });
